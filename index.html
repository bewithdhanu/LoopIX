<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paper.io 2</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
    #app { position: relative; width: 100vw; height: 100vh; }
    canvas { display: block; }

    .overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(10,10,30,0.85);
      z-index: 10;
    }
    .overlay.hidden { display: none; }

    .panel {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 16px;
      padding: 40px 50px;
      text-align: center;
      color: #fff;
      min-width: 320px;
    }

    .panel h1 { font-size: 2.8rem; font-weight: 800; letter-spacing: 2px; margin-bottom: 8px; }
    .panel h2 { font-size: 1.8rem; font-weight: 700; margin-bottom: 24px; }
    .panel p { color: rgba(255,255,255,0.6); margin-bottom: 24px; font-size: 0.95rem; }
    .panel .stat { font-size: 1.1rem; margin: 8px 0; color: rgba(255,255,255,0.85); }
    .panel .stat span { font-weight: 700; color: #fff; }

    input[type="text"] {
      width: 100%; padding: 12px 16px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 8px; color: #fff;
      font-size: 1rem; outline: none;
      margin-bottom: 20px;
    }
    input[type="text"]::placeholder { color: rgba(255,255,255,0.4); }
    input[type="text"]:focus { border-color: rgba(255,255,255,0.6); }

    button {
      padding: 14px 40px;
      background: linear-gradient(135deg, #6c63ff, #4facfe);
      border: none; border-radius: 8px;
      color: #fff; font-size: 1.1rem; font-weight: 700;
      cursor: pointer; letter-spacing: 1px;
      transition: opacity 0.2s, transform 0.1s;
    }
    button:hover { opacity: 0.9; transform: scale(1.02); }
    button:active { transform: scale(0.98); }

    .subtitle { font-size: 0.85rem; color: rgba(255,255,255,0.4); margin-top: 20px; }
  </style>
  <script type="module" crossorigin src="/LoopIX/assets/index-PnguilLy.js"></script>
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>

    <div id="start-screen" class="overlay">
      <div class="panel">
        <h1>PAPER.IO 2</h1>
        <p>Capture territory. Destroy enemies. Dominate the map.</p>
        <input type="text" id="player-name" maxlength="16" placeholder="Enter your name..." />
        <br />
        <button id="play-btn">PLAY</button>
        <p class="subtitle">WASD / Arrow Keys &nbsp;&middot;&nbsp; Mobile: Swipe</p>
      </div>
    </div>

    <div id="gameover-screen" class="overlay hidden">
      <div class="panel">
        <h2>GAME OVER</h2>
        <div id="go-killer" class="stat"></div>
        <div id="go-territory" class="stat">Territory: <span id="go-territory-val">0%</span></div>
        <div id="go-kills" class="stat">Kills: <span id="go-kills-val">0</span></div>
        <br />
        <button id="restart-btn">PLAY AGAIN</button>
      </div>
    </div>
  </div>
</body>
</html>
